<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Jellymatrix</title>

    <!-- Bootstrap core CSS -->
    <link href="/static/bootstrap.min.css" rel="stylesheet">

    <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
      body {
        padding-top: 5rem;
      }
      form {
        margin-bottom: 2rem;
      }
    </style>

    <!-- Custom styles for this template -->
    <link href="/static/starter-template.css" rel="stylesheet">
  </head>
  <body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">jellymatrix</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExampleDefault" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarsExampleDefault">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item active">
          <a class="nav-link" aria-current="page" href="#">Settings</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://github.com/benovard/jellymatrix/blob/main/README.md">Documentation</a>
        </li>
    </div>
  </div>
</nav>

<main class="container">

  <div class="starter-template py-5 px-3">
    <h1>Settings</h1>
    <form action="/brightness" method="POST">
      <div class="form-group">
        <label for="formControlRange">Brightness</label>
        <input min="10" type="range" class="form-control-range" id="formControlRange" step="10" name="brightness" value="{{ brightness }}">
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
    </form>
    <form action="/size" method="POST" class="form-row">
      <label class="my-1 mr-2" for="inlineFormCustomSelectPref">Rows</label>
      <select name="rows" class="custom-select my-1 mr-sm-2" id="inlineFormCustomSelectPref">
        <option {% if rows==32 %} selected="selected"{% endif %} value="32">32</option>
        <option {% if rows==64 %} selected="selected"{% endif %} value="64">64</option>
      </select>
      <label class="my-1 mr-2" for="inlineFormCustomSelectPref2">Columns</label>
      <select name="columns" class="custom-select my-1 mr-sm-2" id="inlineFormCustomSelectPref2">
        <option {% if columns==32 %} selected="selected"{% endif %} value="32">32</option>
        <option {% if columns==64 %} selected="selected"{% endif %} value="64">64</option>
      </select>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>
    <form action="/refresh-rate" method="POST" class="form-row">
      <label class="my-1 mr-2" for="inlineFormCustomSelectPref">Refresh Rate (Hz)</label>
      <select name="refresh_rate" class="custom-select my-1 mr-sm-2" id="inlineFormCustomSelectPref">
        <option {% if refresh_rate==60 %} selected="selected"{% endif %} value="60">60</option>
        <option {% if refresh_rate==90 %} selected="selected"{% endif %} value="90">90</option>
        <option {% if refresh_rate==120 %} selected="selected"{% endif %} value="120">120</option>
      </select>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>
    <form action="/jellyfin" method="POST">
      <div class="form-group">
        <label for="server_url">Jellyfin Server URL</label>
        <input type="text" class="form-control" id="server_url" name="server_url" value="{{ server_url }}" placeholder="http://jellyfin-server:8096">
        <label for="api_key">API Key</label>
        <input type="text" class="form-control" id="api_key" name="api_key" value="{{ api_key }}" placeholder="jellyfin api key">
        <label for="device">Device Filter</label>
        <input type="text" class="form-control" id="device" name="device" value="{{ device }}" placeholder="optional device name, e.g. Desktop">
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>
    <form action="/power" method="POST">
      <div class="form-group">
        <label>Power</label>
        <input {% if power=='on' %} disabled="disabled"{% endif %} type="submit" name="power" class="btn btn-success" value="on">
        <input {% if power=='off' %} disabled="disabled"{% endif %} type="submit" name="power" class="btn btn-danger" value="off">
      </div>
    </form>
  </div>

</main><!-- /.container -->

    <script src="/static/bootstrap.min.js"></script>

  </body>
</html>
